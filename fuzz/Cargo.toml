
[package]
name = "pnet-fuzz"
version = "0.0.1"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies.pnet]
path = ".."
[dependencies.libfuzzer-sys]
git = "https://github.com/rust-fuzz/libfuzzer-sys.git"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "ether"
path = "fuzzers/ether.rs"

[[bin]]
name = "ipv4"
path = "fuzzers/ipv4.rs"

[[bin]]
name = "ipv6"
path = "fuzzers/ipv6.rs"

[[bin]]
name = "tcp"
path = "fuzzers/tcp.rs"

[[bin]]
name = "udp"
path = "fuzzers/udp.rs"

[[bin]]
name = "vlan"
path = "fuzzers/vlan.rs"

[[bin]]
name = "icmp"
path = "fuzzers/icmp.rs"

[[bin]]
name = "icmpv6"
path = "fuzzers/icmpv6.rs"

[[bin]]
name = "dns"
path = "fuzzers/dns.rs"
